# Data settings for milestones 0 and 1. See PLAN.md sections 3 and 4.
# Every value marked "check in milestone 0" was chosen before the source files
# could be inspected and may need changing.

source:
  # World English Bible, verse-per-line text ("GEN 1:1 In the beginning...").
  # Check in milestone 0.
  text_url: https://ebible.org/Scriptures/eng-web_vpl.zip

  # Candidate pages that link to audio. Each may be a different recording
  # (and a different reader), so notebook 00 compares them and only ONE is
  # used. Check in milestone 0.
  audio_pages:
    - https://ebible.org/eng-web/audio/
    - https://ebible.org/webaudio/mp3.htm

  # The page chosen in notebook 00 (one of audio_pages). While null, the
  # notebook uses whichever page covers the most chapters in the splits.
  audio_page: null

  # If the site only offers one large zip of all audio, put its URL here.
  audio_zip_url: null

  # Optional regex for audio file names, with named groups "book" and
  # "chapter". "book" may be a USFM code (MAT), a book name (Matthew) or a
  # book number (40). Leave null to let the guesser try.
  audio_filename_regex: null

paths:
  # Durable storage. Everything expensive to recreate lives here.
  drive_root: /content/drive/MyDrive/bibletts
  # Fast local disk for the current Colab session.
  local_root: /content/bibletts_data

audio:
  sample_rate: 22050      # drop to 16000 if the source has nothing above 8 kHz
  n_fft: 1024
  hop_length: 256         # one frame = 256 / 22050 = 11.6 ms
  win_length: 1024
  n_mels: 80
  fmin: 0
  fmax: 8000
  loudness_target_dbfs: -20

pauses:
  threshold_db: -40       # quieter than this, relative to loud speech, is silence
  min_duration_s: 0.3     # shorter silences are not pauses

text:
  # Letters the models may see. Anything else is reported, then dropped.
  alphabet: "abcdefghijklmnopqrstuvwxyz'"
  # Remove accents (é -> e). Right for English; wrong for many other languages.
  strip_accents: true
  # Spoken at the start of each chapter, if the reader says one. Fill in after
  # listening in milestone 0. Placeholders: {book_name}, {chapter_words}.
  # Example: "{book_name}, chapter {chapter_words}."
  chapter_announcement: null

# Which chapters belong to which set. Split by chapter and never change it
# once training starts. "all" means every chapter; ranges like "1-21" work.
# Check the hours in milestone 0 and adjust the train list to land on ~10 h.
splits:
  train:
    MAT: all
    MRK: all
    LUK: all
    JHN: all
    ACT: "1-21"
  dev:                     # one chapter held out of each training book
    MAT: [14]
    MRK: [8]
    LUK: [12]
    JHN: [10]
    ACT: [10]
  test_same:               # same narrative style, never heard
    ACT: "22-28"
  test_style:              # different styles: creation, poetry, wisdom, apocalyptic
    GEN: "1-3"
    PSA: [23, 91, 103]
    PRO: [3]
    REV: [21]
  test_names:              # genealogy, dense with rare names
    1CH: [1]
