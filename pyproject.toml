[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibletts"
version = "0.1.0"
description = "From-scratch single-speaker Bible text-to-speech, proof of concept"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "librosa",      # used only for its mel filterbank formula, no models
    "soundfile",
    "pyyaml",
    "matplotlib",
    "requests",
    "tqdm",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
